name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Test
        run: go test ./...

      - name: Install resource compiler
        run: go install github.com/akavel/rsrc@latest

      - name: Decode app icon
        shell: pwsh
        run: |
          $iconBytes = [Convert]::FromBase64String((Get-Content "assets/app-icon.ico.b64" -Raw).Trim())
          [IO.File]::WriteAllBytes((Join-Path $PWD "assets/app-icon.ico"), $iconBytes)

      - name: Embed icon
        shell: pwsh
        run: |
          $goBin = Join-Path (go env GOPATH) "bin"
          & "$goBin\rsrc.exe" -ico assets/app-icon.ico -o rsrc_windows_amd64.syso

      - name: Build Windows x64 GUI
        run: go build -trimpath -ldflags="-s -w -H=windowsgui" -o dist/JSON-Google-Docs-Converter.exe .

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: JSON-Google-Docs-Converter-windows-x64
          path: dist/JSON-Google-Docs-Converter.exe
          if-no-files-found: error
